name: Docker

# Builds the image and smoke-tests it on pull requests that touch the image,
# and publishes a multi-arch image to GHCR when a version tag is pushed.
#
#   ghcr.io/sai-manoj-kumar/beadscope:0.5.0   (also :0.5 and :latest)
#
# Run it by hand from the Actions tab to try the full multi-arch build; set
# "push" to publish the current ref's image without a tag.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - next.config.ts
      - .github/workflows/docker.yml
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to GHCR
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the build number is the commit count

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build metadata
        id: meta
        run: |
          echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: beadscope:smoke
          build-args: |
            BUILD_NUMBER=${{ steps.meta.outputs.number }}
            BUILD_SHA=${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Start the container and check it serves
        run: |
          docker run -d --name beadscope -p 3000:3000 beadscope:smoke
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:3000/ && break
            sleep 1
          done
          curl -fsS -o /dev/null -w "/: %{http_code}\n" http://localhost:3000/
          curl -fsS -o /dev/null -w "/api/projects: %{http_code}\n" http://localhost:3000/api/projects
          docker exec beadscope bd --version
          docker exec beadscope id -un

      - name: Container logs
        if: failure()
        run: docker logs beadscope

  publish:
    name: publish
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.push)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: build
        run: |
          echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push (amd64, arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_NUMBER=${{ steps.build.outputs.number }}
            BUILD_SHA=${{ steps.build.outputs.sha }}
          cache-from: type=gha,scope=multi
          cache-to: type=gha,scope=multi,mode=max
